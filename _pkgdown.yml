url: https://EpiForeSITE.github.io/linkeR/
template:
  bootstrap: 5
  light-switch: false
  bslib:
    brand: pkgdown/brand/_brand.yml
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: "linkeR - Link Interactive Plots and Tables"
  description: >
    A simple interface to create bidirectional links between interactive 
    plots and tables in 'shiny' applications.

navbar:
  bg: light
  structure:
    left: [intro, reference, articles, tutorials, news]
    right: [search, github]

footer:
  structure:
    left: [developed_by, foresite]
    right: built_with
  components:
    foresite: >-
      Part of the [ForeSITE](https://github.com/EpiForeSITE) software
      ecosystem. This project was made possible by cooperative agreement
      CDC-RFA-FT-23-0069 from the CDC's Center for Forecasting and Outbreak
      Analytics. Its contents are solely the responsibility of the authors and do
      not necessarily represent the official views of the Centers for Disease
      Control and Prevention.

reference:
- title: "Main Function"
  desc: "The easiest way to link components"
  contents:
  - link_plots

- title: "Advanced Usage & Component API"
  desc: >
    For advanced use cases or integrating custom components. Most users
    should start with `link_plots()`.
  contents:
  - create_link_registry
  - register_leaflet
  - register_dt
  - register_plotly
  - prepare_plotly_linking
  - diagnose_registry

- title: "Internal Functions"
  desc: "Internal functions for advanced users"
  contents:
  - setup_component_observers
  - setup_leaflet_observers
  - setup_datatable_observers
  - update_leaflet_selection
  - update_dt_selection
  - apply_default_leaflet_behavior

# Exclude imports from documentation
- title: internal
  contents:
  - linkeR-imports

articles:
- title: "Getting Started"
  navbar: ~
  contents:
  - getting-started

- title: "Using with 'shiny' Modules"
  navbar: ~
  contents:
  - using-with-modules

- title: "Advanced Usage"
  navbar: ~
  contents:
  - multiple-components

- title: "Custom Behaviors"
  navbar: ~
  contents:
  - custom-behaviors

- title: "sf Integration"
  navbar: ~
  contents:
  - sf-integration

- title: "Using plotly"
  navbar: ~
  contents:
  - using-plotly
